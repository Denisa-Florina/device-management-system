<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/devices" class="brand-link">
      <span class="brand-icon">&#128241;</span>
      <span class="brand-text">Device Management</span>
    </a>
  </div>

  @if (authService.isLoggedIn()) {
    <div class="navbar-links">
      <a routerLink="/devices" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
        Devices
      </a>
      @if (authService.isAdmin()) {
        <a routerLink="/devices/new" routerLinkActive="active" class="nav-link">
          Add Device
        </a>
        <a routerLink="/users" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}" class="nav-link">
          Users
        </a>
      }
    </div>

    <div class="navbar-user">
      <span class="user-email">{{ authService.getUser()?.email }}</span>
      <span class="role-badge" [class.role-admin]="authService.isAdmin()" [class.role-customer]="!authService.isAdmin()">
        {{ authService.getUser()?.role }}
      </span>
      <button class="btn-logout" (click)="authService.logout()">Logout</button>
    </div>
  }
</nav>
